<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF2F8" />
      <stop offset="50%" stop-color="#FCE7F3" />
      <stop offset="100%" stop-color="#FFE4E6" />
    </linearGradient>
    <linearGradient id="silhouetteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <circle cx="60" cy="60" r="60" fill="url(#avatarBg)" />
  <circle cx="60" cy="60" r="58.5" fill="none" stroke="#F472B6" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Female Silhouette with Soft Blur Effect -->
  <g filter="url(#softGlow)" fill="url(#silhouetteGrad)" opacity="0.88">
    <!-- Hair Volume (Feminine bob / soft hair style) -->
    <path d="M 60 18 C 45 18 35 28 35 44 C 35 56 38 68 43 76 C 45 74 46 68 47 62 C 48 50 51 40 60 40 C 69 40 72 50 73 62 C 74 68 75 74 77 76 C 82 68 85 56 85 44 C 85 28 75 18 60 18 Z" />

    <!-- Head & Face Profile -->
    <ellipse cx="60" cy="46" rx="14.5" ry="17.5" />

    <!-- Slender Neck -->
    <path d="M 54 61 L 54 75 C 56 76 64 76 66 75 L 66 61 Z" />

    <!-- Soft Feminine Shoulders & Collar -->
    <path d="M 22 114 C 23 97 34 85 50 80 C 53 79 67 79 70 80 C 86 85 97 97 98 114 C 98 120 22 120 22 114 Z" />
  </g>

  <!-- Gentle soft light highlight -->
  <ellipse cx="48" cy="38" rx="4" ry="7" fill="#FFFFFF" opacity="0.25" transform="rotate(-15 48 38)" />
</svg>
